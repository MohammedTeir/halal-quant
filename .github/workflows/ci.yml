name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: halal
          POSTGRES_PASSWORD: halal
          POSTGRES_DB: halal_quant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U halal -d halal_quant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://halal:halal@localhost:5432/halal_quant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Dashboard JavaScript syntax
        run: |
          node --check apps/dashboard/static/app.js
          node --check apps/dashboard/static/accounts.js
          node --check apps/dashboard/static/i18n.js
          node --check scripts/dashboard_browser_smoke.cjs
      - run: uv run pytest -q
      - name: Synthetic research CLI acceptance
        run: uv run python -m scripts.research_smoke --output reports/generated/ci
      - name: Portfolio replay and training-only optimization acceptance (synthetic)
        run: uv run python -m scripts.portfolio_smoke --output reports/generated/portfolio-ci

      - name: Gemini mock API acceptance (no real key or provider calls)
        run: uv run python -m scripts.gemini_mock_smoke --output reports/generated/gemini-mock-ci.json

      - name: Offline model evaluation harness (synthetic responses only)
        run: >-
          uv run python -m services.news_intelligence.evaluation
          --corpus examples/intelligence/evaluation/corpus-v1.json
          --responses examples/intelligence/evaluation/mock-responses-v1.json
          --output reports/generated/evaluation-harness-ci.json
