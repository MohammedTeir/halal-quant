services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: halal
      POSTGRES_PASSWORD: halal
      POSTGRES_DB: halal_quant
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halal -d halal_quant"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      secrets:
        - proxy_ca
    environment:
      DATABASE_URL: postgresql+psycopg://halal:halal@postgres:5432/halal_quant
    depends_on:
      postgres:
        condition: service_healthy
    command: [".venv/bin/alembic", "upgrade", "head"]
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      secrets:
        - proxy_ca
    environment:
      DATABASE_URL: postgresql+psycopg://halal:halal@postgres:5432/halal_quant
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      TRADINGVIEW_WEBHOOK_KEY: ${TRADINGVIEW_WEBHOOK_KEY:-}
      DATA_INGESTION_KEY: ${DATA_INGESTION_KEY:-}
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      CONTROLS_REVIEWER_KEY: ${CONTROLS_REVIEWER_KEY:-}
      CONTROLS_OPERATOR_KEY: ${CONTROLS_OPERATOR_KEY:-}
      CONTROLS_BROKER_KEY: ${CONTROLS_BROKER_KEY:-}
      CONTROLS_REVIEWER_IDENTITY: ${CONTROLS_REVIEWER_IDENTITY:-}
      CONTROLS_OPERATOR_IDENTITY: ${CONTROLS_OPERATOR_IDENTITY:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-}
      EARNINGS_PROVIDER: ${EARNINGS_PROVIDER:-}
      FOMC_PROVIDER: ${FOMC_PROVIDER:-}
      SSL_CERT_FILE: /run/secrets/proxy_ca
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-4096}
      LIVE_TRADING_ENABLED: "false"
    secrets:
      - proxy_ca
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  postgres_data:
secrets:
  proxy_ca:
    file: ${HALAL_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
